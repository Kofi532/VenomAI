<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenomGuard AI Access</title>
  <style>
    :root {
      --bg: #12151e;
      --panel: #1b202e;
      --card: #1d2533;
      --line: rgba(255,255,255,0.08);
      --text: #f5f7fa;
      --muted: #a7b0c0;
      --gold: #f5b800;
      --gold-soft: rgba(245,184,0,0.16);
      --red: #ff3b30;
      --shadow: 0 22px 50px rgba(0,0,0,0.32);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px 16px;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(245,184,0,0.1), transparent 32%),
        linear-gradient(180deg, #171d2a, var(--bg) 58%, #0d1119);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .access-shell { width: min(480px, 100%); }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 4px 18px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), #ffd14d);
      color: #111827;
      font-size: 18px;
      font-weight: 900;
    }
    .brand-name {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .access-card {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(27,32,46,0.94);
      box-shadow: var(--shadow);
    }
    .step-label {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 25px;
      line-height: 1.15;
    }
    .intro {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .progress {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }
    .progress-segment {
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
    }
    .progress-segment.active { background: var(--gold); }
    .error {
      margin: 0 0 16px;
      padding: 11px 12px;
      border: 1px solid rgba(255,59,48,0.35);
      border-radius: 12px;
      background: rgba(255,59,48,0.1);
      color: #ffb1ac;
      font-size: 13px;
      line-height: 1.45;
    }
    .field-group { margin: 0 0 16px; }
    label, legend {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    input[type="password"],
    input[type="text"],
    select {
      width: 100%;
      margin: 0;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font: inherit;
      font-size: 15px;
    }
    input:focus, select:focus {
      border-color: rgba(245,184,0,0.7);
      box-shadow: 0 0 0 3px rgba(245,184,0,0.12);
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -2px 0 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
    }
    .toggle input { accent-color: var(--gold); }
    .member-options { display: grid; gap: 8px; }
    .member-option {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 0;
      text-transform: none;
    }
    .member-option:has(input:checked) {
      border-color: rgba(245,184,0,0.55);
      background: var(--gold-soft);
      color: #ffd867;
    }
    .member-option input { accent-color: var(--gold); }
    .actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      min-height: 46px;
      padding: 11px 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), #ffd14d);
      color: #111827;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.06); }
    .back {
      padding: 10px 4px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }
    @media (max-width: 380px) {
      .access-card { padding: 18px; }
      .actions { grid-template-columns: 1fr; }
      .back { text-align: center; }
    }
  </style>
</head>
<body>
  <main class="access-shell">
    <div class="brand-row" aria-label="VenomGuard AI">
      <div class="brand-mark" aria-hidden="true">V</div>
      <p class="brand-name">VenomGuard AI</p>
    </div>

    <section class="access-card" aria-label="VenomGuard access form">
      <p class="step-label">{% if show_profile_form %}Step 2 of 2{% else %}Step 1 of 2{% endif %}</p>
      <h1>{% if show_profile_form %}Set your profile{% else %}Welcome back{% endif %}</h1>
      <p class="intro">
        Choose your country to continue.
      </p>
      <div class="progress" aria-label="Access progress">
        <span class="progress-segment active"></span>
        <span class="progress-segment active"></span>
      </div>

      {% if error_message %}
        <div class="error" role="alert">{{ error_message }}</div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}">
        <input type="hidden" name="action" value="profile">
        <div class="field-group">
          <label for="nationality">Country</label>
          <select id="nationality" name="nationality" required>
            <option value="">Select your country</option>
            {% for code, label in nationality_options %}
              <option value="{{ code }}" {% if selected_nationality == code %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="actions">
          <button type="submit">Continue to community home</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
