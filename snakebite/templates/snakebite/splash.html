<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f17">
  <title>VenomGuard-AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    @keyframes breathe {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .logo-breathe { animation: breathe 4s ease-in-out infinite; }
    .progress-shimmer {
      background: linear-gradient(90deg, #d97706, #fbbf24, #f59e0b, #d97706);
      background-size: 200% 100%;
      animation: shimmer 2.5s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-breathe, .progress-shimmer { animation: none; }
    }
  </style>
</head>
<body class="min-h-screen bg-[#0b0f17] text-white">
  <div id="splash-root"></div>
  <script>
    const { useEffect, useState } = React;

    function SnakeSpotSplash() {
      const [progress, setProgress] = useState(8);
      const accentClasses = {
        rose: 'bg-rose-400/10 ring-rose-300/20',
        amber: 'bg-amber-400/10 ring-amber-300/20',
        blue: 'bg-blue-400/10 ring-blue-300/20',
        cyan: 'bg-cyan-400/10 ring-cyan-300/20',
        emerald: 'bg-emerald-400/10 ring-emerald-300/20',
        violet: 'bg-violet-400/10 ring-violet-300/20'
      };

      useEffect(() => {
        const timer = window.setInterval(() => {
          setProgress((current) => {
            if (current >= 100) {
              window.clearInterval(timer);
              return 100;
            }
            return Math.min(current + 1, 100);
          });
        }, 420);
        return () => window.clearInterval(timer);
      }, []);

      useEffect(() => {
        if (progress < 100) {
          return undefined;
        }
        const redirectTimer = window.setTimeout(() => {
          window.location.href = '/venomguard/access/?reset_access=1&step=profile';
        }, 700);
        return () => window.clearTimeout(redirectTimer);
      }, [progress]);

      return React.createElement(
        'main',
        { className: 'relative flex min-h-screen flex-col items-center overflow-hidden px-6 py-12' },
        React.createElement('div', { className: 'pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_35%,rgba(245,158,11,0.09),transparent_30%)]' }),
        React.createElement(
          'section',
          { className: 'relative flex w-full max-w-sm flex-col items-center text-center' },
          React.createElement(
            'div',
            { className: 'logo-breathe relative mb-8 flex h-32 w-32 items-center justify-center', 'aria-label': 'VenomGuard-AI emblem' },
            React.createElement('div', { className: 'absolute inset-1 rounded-[2.25rem] border border-amber-400/20 bg-slate-900 shadow-[0_20px_55px_rgba(0,0,0,0.4)] rotate-6' }),
            React.createElement('div', { className: 'absolute inset-3 rounded-[2rem] border border-amber-400/40 bg-gradient-to-br from-amber-400/20 to-slate-900 -rotate-6' }),
            React.createElement('div', { className: 'relative flex h-20 w-20 items-center justify-center rounded-3xl bg-slate-950 text-5xl shadow-inner shadow-amber-400/20' }, '🐍'),
            React.createElement('span', { className: 'absolute -right-1 top-2 h-3 w-3 rounded-full bg-amber-400 shadow-[0_0_16px_#f59e0b]' })
          ),
          React.createElement(
            'h1',
            { className: 'text-4xl font-bold tracking-tight text-white' },
            'VenomGuard-AI'
          ),
          React.createElement('p', { className: 'mt-4 text-sm font-bold text-amber-400' }, 'From Bite to Treatment — Faster, Safer, More Coordinated.'),
          React.createElement(
            'div',
            { className: 'mt-6 text-sm leading-6 text-slate-300' },
            React.createElement('p', null, 'Connecting communities, healthcare workers, traditional healers, community ambassadors, transport resources and health facilities to support timely snakebite care.')
          ),
        ),
        React.createElement(
          'section',
          { className: 'relative mt-24 w-full max-w-6xl', 'aria-labelledby': 'benefits-heading' },
          React.createElement(
            'div',
            { className: 'mx-auto max-w-2xl text-center' },
            React.createElement('p', { className: 'text-xs font-semibold uppercase tracking-[0.24em] text-amber-400' }, 'Care, connected'),
            React.createElement('h2', { id: 'benefits-heading', className: 'mt-3 text-3xl font-bold tracking-tight text-white sm:text-4xl' }, 'How VenomGuard-AI Benefits Snakebite Patients')
          ),
          React.createElement(
            'div',
            { className: 'mt-10 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3' },
            [
              ['🩹', 'First Aid Guidance', 'Act quickly. Get clear, evidence-based first-aid guidance on what to do—and what to avoid—while preparing to seek appropriate medical care.', 'rose'],
              ['⚠️', 'Assess the Bite', 'Recognise warning signs early. Complete a simple guided assessment of the bite, symptoms, timing and location to support early recognition of potentially severe envenoming.', 'amber'],
              ['🏥', 'Get Referral Support', 'Know where to go. Receive AI-supported urgency and referral guidance based on reported symptoms, location and local snake epidemiology, helping connect patients with the appropriate health facility.', 'blue'],
              ['🚑', 'Coordinate Transport', 'Get help reaching care. Where community transport resources are available, VenomGuard-AI helps coordinate referral transport and supports communication with the receiving health facility.', 'cyan'],
              ['👨🏾‍⚕️', 'Connect with Health Workers', 'Keep care connected. Share relevant bite and patient information with healthcare workers so they can review the case, confirm clinical findings and prepare for the patient’s arrival.', 'emerald'],
              ['🤖', 'AI-Supported Clinical Decision Support', 'Support better decisions. At health facilities, VenomGuard-AI combines clinical findings, available snake photographs and local epidemiological information to provide transparent, interpretable AI-supported bite assessment, risk stratification and clinical decision support.', 'violet']
            ].map(([icon, title, body, accent]) => React.createElement(
              'article',
              { key: title, className: 'flex gap-4 rounded-2xl border border-white/10 bg-slate-800/75 p-6 text-left shadow-[inset_0_1px_0_rgba(255,255,255,0.05)] transition-colors hover:border-white/20 hover:bg-slate-800' },
              React.createElement('div', { className: `flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-xl ring-1 ring-inset ${accentClasses[accent]}`, 'aria-hidden': 'true' }, icon),
              React.createElement(
                'div',
                null,
                React.createElement('h3', { className: 'text-base font-semibold leading-6 text-white' }, title),
                React.createElement('p', { className: 'mt-2 text-sm leading-6 text-slate-300' }, body)
              )
            ))
          )
        ),
        React.createElement(
          'section',
          { className: 'relative mt-16 w-full max-w-xl text-center', 'aria-label': 'Loading predictive model' },
          React.createElement('p', { className: 'text-sm font-medium text-slate-300' }, 'Take a moment to explore how VenomGuard-AI supports the journey from bite to treatment.'),
          React.createElement(
            'div',
            { className: 'mt-5 h-2 w-full overflow-hidden rounded-full bg-slate-800', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': progress },
            React.createElement('div', { className: 'progress-shimmer h-full rounded-full transition-[width] duration-500 ease-out', style: { width: `${progress}%` } })
          ),
          React.createElement('p', { className: 'mt-4 text-2xl font-semibold tabular-nums text-amber-400' }, `${progress}%`),
          React.createElement('p', { className: 'mt-2 text-xs text-slate-500' }, 'Preparing your regional care experience...')
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('splash-root')).render(React.createElement(SnakeSpotSplash));
  </script>
</body>
</html>
