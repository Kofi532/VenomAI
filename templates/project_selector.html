<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VenomGuard AI</title>
    <style>
        :root {
            --ink: #14213d;
            --accent: #fca311;
            --paper: #f6f7f8;
            --card: rgba(255, 255, 255, 0.86);
            --shadow: 0 22px 50px rgba(20, 33, 61, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--ink);
            background: linear-gradient(140deg, #eef2f5, var(--paper));
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .shell {
            width: min(680px, 100%);
            background: var(--card);
            border: 1px solid rgba(20, 33, 61, 0.12);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 28px;
        }

        .eyebrow {
            display: inline-block;
            background: rgba(252, 163, 17, 0.18);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        h1 {
            margin: 14px 0 12px;
            font-size: clamp(28px, 4vw, 38px);
        }

        p {
            margin: 0;
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .cta {
            display: inline-block;
            margin-top: 24px;
            text-decoration: none;
            background: var(--accent);
            color: #111827;
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <main class="shell">
        <span class="eyebrow">Snakebite Response</span>
        <h1>VenomGuard AI</h1>
        <p>
            This web app is focused on snakebite risk assessment, first-aid guidance, field triage, and nearby antivenom support.
        </p>
        <a class="cta" href="{% url 'snakebite:access' %}?next=/snakebite/&reset_access=1">Open VenomGuard AI</a>
    </main>
</body>
</html>
